security:
  - bearerAuth: []
paths:
  /api/common/v1/locations/cities:
    get:
      tags: ['Public / Common / Locations']
      summary: List active cities
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/StateIdQuery'}, {$ref: '#/components/parameters/CountryIdOptionalQuery'}, {$ref: '#/components/parameters/LocationSearch'}]
      responses:
        '200': {$ref: '#/components/responses/CityListResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/common/v1/locations/countries:
    get:
      tags: ['Public / Common / Locations']
      summary: List active countries
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/LocationSearch'}]
      responses:
        '200': {$ref: '#/components/responses/CountryListResponse'}
  /api/common/v1/locations/states:
    get:
      tags: ['Public / Common / Locations']
      summary: List active states
      description: Common state dropdown API. Pass either country_id or country_iso2; optional search filters by state name or code.
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/CountryIdQuery'}, {$ref: '#/components/parameters/CountryIso2Query'}, {$ref: '#/components/parameters/LocationSearch'}]
      responses:
        '200': {$ref: '#/components/responses/StateListResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/accounts/discover:
    post:
      tags: ['Public / Auth / Account Discovery']
      summary: Discover accounts by email
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiscoverRequest'}
            example: {email: user@example.com, device_name: Chrome on Windows}
      responses:
        '200': {$ref: '#/components/responses/DiscoverResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/accounts/login:
    post:
      tags: ['Public / Auth / Login and 2FA']
      summary: Login selected account
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UnifiedLoginRequest'}
            example: {email: user@example.com, discovery_token: disc_short_lived_token, account_ref: acct_opaque_ref, password: StrongPassword#123, remember: true, device_name: Chrome on Windows}
      responses:
        '200': {$ref: '#/components/responses/LoginResponse'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/accounts/login/2fa:
    post:
      tags: ['Public / Auth / Login and 2FA']
      summary: Verify login 2FA challenge
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginTwoFactorRequest'}
      responses:
        '200': {$ref: '#/components/responses/LoginResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/logout:
    post:
      tags: ['Public / Auth / Session']
      summary: Logout current unified session
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {all_devices: {type: boolean, example: false}}}
      responses:
        '200': {$ref: '#/components/responses/LogoutResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/auth/v1/me:
    get:
      tags: ['Public / Auth / Session']
      summary: Current unified session
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/CurrentSessionResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/auth/v1/password/forgot:
    post:
      tags: ['Public / Auth / Password Reset']
      summary: Request password reset
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ForgotPasswordResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/password/reset:
    post:
      tags: ['Public / Auth / Password Reset']
      summary: Reset password
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ResetPasswordResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/tenants/register:
    post:
      tags: ['Public / Auth / Tenant Registration']
      summary: Register a new SaaS tenant and owner account
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantRegistrationRequest'}
            example:
              organization_name: Acme Pvt Ltd
              legal_name: Acme Private Limited
              display_name: Acme
              organization_code: ACME
              slug: acme
              company_size: small
              default_currency: INR
              default_timezone: Asia/Kolkata
              owner:
                first_name: Sahil
                last_name: Owner
                display_name: Sahil Owner
                email: owner@example.com
                mobile: '+919999999999'
                password: Password@123
                password_confirmation: Password@123
              office:
                office_name: Head Office
                address_line_1: Main Street
                postal_code: '400001'
      responses:
        '201': {$ref: '#/components/responses/TenantRegistrationResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/platform/v1/auth/2fa/confirm:
    post:
      tags: ['Platform / Account / Two-Factor Auth']
      summary: Confirm platform TOTP 2FA setup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TwoFactorCodeRequest'}
      responses: {'200': {$ref: '#/components/responses/TwoFactorConfirmResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/platform/v1/auth/2fa/disable:
    post:
      tags: ['Platform / Account / Two-Factor Auth']
      summary: Disable platform 2FA
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [password], properties: {password: {type: string, format: password}}}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/platform/v1/auth/2fa/enable:
    post:
      tags: ['Platform / Account / Two-Factor Auth']
      summary: Start platform TOTP 2FA setup
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/TwoFactorEnableResponse'}}
  /api/platform/v1/auth/forgot-password:
    post:
      tags: ['Platform / Account / Password']
      summary: Request platform password reset
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformForgotPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ForgotPasswordResponse'}
  /api/platform/v1/auth/logout:
    post:
      tags: ['Platform / Account / Session']
      summary: Revoke current platform token
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '401': {$ref: '#/components/responses/Unauthenticated'}}
  /api/platform/v1/auth/me:
    get:
      tags: ['Platform / Account / Session']
      summary: Platform current user
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PlatformMeResponse'}}
  /api/platform/v1/auth/refresh:
    post:
      tags: ['Platform / Account / Session']
      summary: Rotate current platform token
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {device_name: {type: string, example: platform-api}}}
      responses: {'200': {$ref: '#/components/responses/TokenRefreshResponse'}}
  /api/platform/v1/auth/reset-password:
    post:
      tags: ['Platform / Account / Password']
      summary: Reset platform password
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ResetPasswordResponse'}
  /api/platform/v1/auth/verify-email/resend:
    post:
      tags: ['Platform / Account / Session']
      summary: Queue platform verification email placeholder
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/platform/v1/profile:
    get:
      tags: ['Platform / Profile / My Profile']
      summary: Get platform profile
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}}
    patch:
      tags: ['Platform / Profile / My Profile']
      summary: Update platform profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
    put:
      tags: ['Platform / Profile / My Profile']
      summary: Update platform profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}}
  /api/platform/v1/profile/password:
    put:
      tags: ['Platform / Profile / Password']
      summary: Change platform password
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/platform/v1/profile/sessions:
    get:
      tags: ['Platform / Profile / Sessions']
      summary: List platform Sanctum sessions/tokens
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SessionsResponse'}}
  /api/platform/v1/profile/sessions/{session_id}:
    delete:
      tags: ['Platform / Profile / Sessions']
      summary: Revoke platform session/token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/platform/v1/settings/preferences:
    get:
      tags: ['Platform / Profile / Preferences']
      summary: List platform preferences
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
    put:
      tags: ['Platform / Profile / Preferences']
      summary: Update platform preferences
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferencesUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
  /api/platform/v1/api-tokens:
    get:
      tags: ['Platform / Account / API Tokens']
      summary: List platform API tokens
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenListResponse'}}
    post:
      tags: ['Platform / Account / API Tokens']
      summary: Create platform API token
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenCreateRequest'}
      responses: {'201': {$ref: '#/components/responses/ApiTokenCreatedResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/platform/v1/api-tokens/{token_uuid}:
    get:
      tags: ['Platform / Account / API Tokens']
      summary: Show platform API token metadata
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenShowResponse'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/platform/v1/api-tokens/{token_uuid}/revoke:
    post:
      tags: ['Platform / Account / API Tokens']
      summary: Revoke platform API token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/platform/v1/api-tokens/{token_uuid}/rotate:
    post:
      tags: ['Platform / Account / API Tokens']
      summary: Rotate platform API token and return raw token once
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenCreatedResponse'}}
  /api/platform/v1/dashboard/active-alerts:
    get: {tags: ['Platform / Dashboard / Alerts'], summary: Platform dashboard active alerts, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/platform/v1/dashboard/alerts:
    get: {tags: ['Platform / Dashboard / Alerts'], summary: Platform dashboard aggregate alerts and security events, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/dashboard/charts:
    get: {tags: ['Platform / Dashboard / Charts'], summary: Platform dashboard aggregate charts, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/dashboard/charts/{chart}:
    get:
      tags: ['Platform / Dashboard / Charts']
      summary: Platform dashboard chart widget
      security: [{bearerAuth: []}]
      parameters:
        - {name: chart, in: path, required: true, schema: {type: string, enum: [tenant-growth, revenue, plan-distribution, subscription-status, usage]}}
      responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/platform/v1/dashboard/export:
    post: {tags: ['Platform / Dashboard / Export'], summary: Export platform dashboard, security: [{bearerAuth: []}], responses: {'201': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/dashboard/overdue-invoices:
    get: {tags: ['Platform / Dashboard / Billing Widgets'], summary: Platform dashboard overdue invoices, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/platform/v1/dashboard/recent:
    get: {tags: ['Platform / Dashboard / Recent Activity'], summary: Platform dashboard aggregate recent records, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/dashboard/recent-payments:
    get: {tags: ['Platform / Dashboard / Recent Activity'], summary: Platform dashboard recent payments, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/platform/v1/dashboard/recent-tenants:
    get: {tags: ['Platform / Dashboard / Recent Activity'], summary: Platform dashboard recent tenants, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/platform/v1/dashboard/security-events:
    get: {tags: ['Platform / Dashboard / Security Widgets'], summary: Platform dashboard security events, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/platform/v1/dashboard/summary:
    get: {tags: ['Platform / Dashboard / Summary'], summary: Platform dashboard summary, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/platform/v1/platform-team-roles:
    get: {tags: ['Platform / Teams / Team Roles'], summary: List platform team roles, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}, {$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/StatusFilter'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Direction'}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
    post: {tags: ['Platform / Teams / Team Roles'], summary: Create platform team role, security: [{bearerAuth: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformTeamRoleCreate'}}}}, responses: {'201': {$ref: '#/components/responses/GenericSuccess'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /api/platform/v1/platform-team-roles/{role_uuid}:
    get: {tags: ['Platform / Teams / Team Roles'], summary: View platform team role, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/RoleUuid'}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '404': {$ref: '#/components/responses/NotFound'}}}
