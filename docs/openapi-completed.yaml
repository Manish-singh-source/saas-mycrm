      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}, {$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/ModuleFilter'}, {$ref: '#/components/parameters/StatusFilter'}, {$ref: '#/components/parameters/GuardFilter'}]
      responses: {'200': {$ref: '#/components/responses/PermissionList'}}
  /api/tenant/v1/access-control/permissions/grouped:
    get:
      tags: [6. Tenant Permissions]
      summary: List tenant permissions grouped by module
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/GroupedPermissions'}}
  /api/tenant/v1/access-control/permissions/{permission_uuid}:
    get:
      tags: [6. Tenant Permissions]
      summary: View tenant permission
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/PermissionUuid'}]
      responses: {'200': {$ref: '#/components/responses/PermissionSingle'}, '404': {$ref: '#/components/responses/NotFound'}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    RequestId: {name: X-Request-Id, in: header, required: false, schema: {type: string, example: '{{REQUEST_ID}}'}}
    TenantHeader: {name: X-Tenant, in: header, required: true, schema: {type: string, example: '{{TENANT}}'}}
    Page: {name: page, in: query, schema: {type: integer, example: 1}}
    PerPage: {name: per_page, in: query, schema: {type: integer, example: 25}}
    Search: {name: search, in: query, schema: {type: string, example: billing}}
    StatusFilter: {name: 'filter[status]', in: query, schema: {type: string, enum: [active, inactive]}}
    RoleTypeFilter: {name: 'filter[type]', in: query, schema: {type: string, enum: [system, custom]}}
    GuardFilter: {name: 'filter[guard_name]', in: query, schema: {type: string, example: platform}}
    ModuleFilter: {name: 'filter[module]', in: query, schema: {type: string, example: billing}}
    SessionId: {name: session_id, in: path, required: true, schema: {type: integer, example: 1}}
    TokenUuid: {name: token_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    RoleUuid: {name: role_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    PermissionUuid: {name: permission_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformUserUuid: {name: platform_user_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    UserUuid: {name: user_uuid, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    DiscoverRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}, device_name: {type: string}}
    UnifiedLoginRequest:
      type: object
      required: [email, discovery_token, account_ref, password]
      properties: {email: {type: string, format: email}, discovery_token: {type: string}, account_ref: {type: string}, password: {type: string, format: password}, remember: {type: boolean}, device_name: {type: string}}
    LoginTwoFactorRequest:
      type: object
      required: [challenge_token, code]
      properties: {challenge_token: {type: string}, code: {type: string, example: '123456'}, remember_device: {type: boolean}, device_name: {type: string}}
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}, account_ref: {type: string}, discovery_token: {type: string}}
    PlatformForgotPasswordRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}}
    TenantForgotPasswordRequest:
      type: object
      required: [tenant, email]
      properties: {tenant: {type: string, example: '{{TENANT}}'}, email: {type: string, format: email}}
    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties: {email: {type: string, format: email}, token: {type: string}, password: {type: string, format: password}, password_confirmation: {type: string, format: password}}
    TenantResetPasswordRequest:
      allOf:
        - $ref: '#/components/schemas/ResetPasswordRequest'
        - type: object
          required: [tenant]
          properties: {tenant: {type: string, example: '{{TENANT}}'}}
    TwoFactorCodeRequest: {type: object, required: [code], properties: {code: {type: string, example: '123456'}}}
    ChangePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties: {current_password: {type: string, format: password}, password: {type: string, format: password}, password_confirmation: {type: string, format: password}}
    ProfileUpdateRequest:
      type: object
      properties: {first_name: {type: string}, last_name: {type: string, nullable: true}, display_name: {type: string}, mobile: {type: string, nullable: true}, profile_photo_file_id: {type: integer, nullable: true}, timezone: {type: string, example: Asia/Kolkata}, locale: {type: string, example: en}}
    PreferencesUpdateRequest:
      type: object
      required: [preferences]
      properties: {preferences: {type: object, additionalProperties: true}}
    ApiTokenCreateRequest:
      type: object
      required: [name, abilities]
      properties: {name: {type: string, example: BI Warehouse Export}, abilities: {type: array, items: {type: string}, example: [report.view, report.export]}, expires_at: {type: string, format: date-time, nullable: true}}
    AuditReason: {type: object, properties: {audit_reason: {type: string, example: Quarterly access review}}}
    RoleWrite:
      type: object
      required: [name, display_name]
      properties:
        name: {type: string, example: billing_manager_custom}
        display_name: {type: string, example: Billing Manager Custom}
        guard_name: {type: string, example: platform}
        description: {type: string, nullable: true}
        status: {type: string, enum: [active, inactive], example: active}
        is_system: {type: boolean, example: false}
        permission_ids: {type: array, items: {type: string, format: uuid}}
        audit_reason: {type: string, nullable: true}
    RoleUpdate:
      allOf: [{$ref: '#/components/schemas/RoleWrite'}]
    RoleClone:
      type: object
      required: [name, display_name]
      properties: {name: {type: string, example: billing_manager_copy}, display_name: {type: string, example: Billing Manager Copy}, copy_permissions: {type: boolean, example: true}, copy_description: {type: boolean, example: true}, status: {type: string, enum: [active, inactive], example: inactive}, audit_reason: {type: string, nullable: true}}
    PermissionAssignment:
      type: object
      required: [permission_ids]
      properties: {permission_ids: {type: array, items: {type: string, format: uuid}}, audit_reason: {type: string, nullable: true}}
    PlatformUserAssignment:
      type: object
      required: [platform_user_ids]
      properties: {platform_user_ids: {type: array, items: {type: string, format: uuid}}, audit_reason: {type: string, nullable: true}}
    TenantUserAssignment:
      type: object
      required: [user_ids]
      properties: {user_ids: {type: array, items: {type: string, format: uuid}}, audit_reason: {type: string, nullable: true}}
    PermissionWrite:
      type: object
      required: [module, name]
      properties: {module: {type: string, example: billing}, name: {type: string, example: billing.adjustment.create}, display_name: {type: string, example: Create Billing Adjustment}, guard_name: {type: string, example: platform}, description: {type: string, nullable: true}, is_system: {type: boolean, example: false}, status: {type: string, enum: [active, inactive], example: active}}
    PermissionUpdate:
      allOf: [{$ref: '#/components/schemas/PermissionWrite'}]
    ApiError:
      type: object
      properties:
        success: {type: boolean, example: false}
        message: {type: string}
        data: {nullable: true}
        meta: {type: object, properties: {request_id: {type: string}}}
        errors: {type: object, properties: {code: {type: string}, details: {type: object}}}
  responses:
    DiscoverResponse: {description: Accounts discovered, content: {application/json: {example: {success: true, message: OK, data: {email: user@example.com, discovery_token: disc_short_lived_token, expires_in_seconds: 300, accounts: [{account_ref: acct_opaque_platform_ref, account_type: platform, auth_guard: platform, display_name: Super Admin, email: user@example.com, roles: [super_admin], status: active}]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    LoginResponse: {description: Login success or 2FA challenge, content: {application/json: {example: {success: true, message: Logged in., data: {access_token: plain_text_token_returned_once, token_type: Bearer, surface: platform, redirect_to: /platform/dashboard, account: {uuid: platform_user_uuid, display_name: Super Admin, roles: [super_admin], permissions: [dashboard.view]}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    CurrentSessionResponse: {description: Current session, content: {application/json: {example: {success: true, message: OK, data: {surface: tenant, account: {uuid: user_uuid, display_name: Staff User, roles: [sales_user], permissions: [lead.view]}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    LogoutResponse: {description: Logged out, content: {application/json: {example: {success: true, message: OK, data: {logged_out: true}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    ForgotPasswordResponse: {description: Password reset queued, content: {application/json: {example: {success: true, message: Password reset instructions queued., data: {reset_token: local_only_reset_token}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    ResetPasswordResponse: {description: Password reset completed, content: {application/json: {example: {success: true, message: Password reset completed., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TokenRefreshResponse: {description: Token refreshed, content: {application/json: {example: {success: true, message: Token refreshed., data: {access_token: plain_text_token_returned_once, token_type: Bearer}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    PlatformMeResponse: {description: Platform current user, content: {application/json: {example: {success: true, message: OK, data: {user: {uuid: platform_user_uuid, display_name: Super Admin}, roles: [super_admin], permissions: [dashboard.view]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TenantMeResponse: {description: Tenant current user, content: {application/json: {example: {success: true, message: OK, data: {tenant: {uuid: tenant_uuid, slug: acme}, user: {uuid: user_uuid, display_name: Acme Owner}, roles: [owner], permissions: [dashboard.view]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    PlatformProfileResponse: {description: Platform profile, content: {application/json: {example: {success: true, message: OK, data: {user: {uuid: platform_user_uuid, display_name: Sahil Admin}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TenantProfileResponse: {description: Tenant profile, content: {application/json: {example: {success: true, message: OK, data: {user: {uuid: user_uuid, display_name: Sahil Owner}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TwoFactorEnableResponse: {description: 2FA setup started, content: {application/json: {example: {success: true, message: Confirm 2FA setup., data: {secret: BASE32TOTPSECRET, provisioning_uri: otpauth://totp/SaaS%20CRM:user@example.com}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TwoFactorConfirmResponse: {description: 2FA enabled, content: {application/json: {example: {success: true, message: 2FA enabled., data: {recovery_codes: [RECOVERYCODE1]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    PreferencesResponse: {description: Preferences, content: {application/json: {example: {success: true, message: OK, data: {preferences: []}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    SessionsResponse: {description: Sessions, content: {application/json: {example: {success: true, message: OK, data: {sessions: [{id: 1, name: Chrome on Windows, abilities: [platform:*]}]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    ApiTokenListResponse: {description: API tokens, content: {application/json: {example: {success: true, message: OK, data: {tokens: [{uuid: token_uuid, name: BI Warehouse Export, abilities: [report.view]}]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    ApiTokenShowResponse: {description: API token metadata, content: {application/json: {example: {success: true, message: OK, data: {uuid: token_uuid, name: BI Warehouse Export, abilities: [report.view]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    ApiTokenCreatedResponse: {description: API token created or rotated, content: {application/json: {example: {success: true, message: API token created., data: {uuid: token_uuid, name: BI Warehouse Export, token: plain_text_token_returned_once, expires_at: '2027-08-06T00:00:00Z'}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    RoleList: {description: Role list, content: {application/json: {example: {success: true, message: OK, data: [{uuid: role_uuid, name: billing_manager, display_name: Billing Manager, status: active, permissions_count: 3, users_count: 2}], meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    RoleSingle: {description: Single role, content: {application/json: {example: {success: true, message: OK, data: {role: {uuid: role_uuid, name: billing_manager, display_name: Billing Manager, status: active, permissions: {billing: [{uuid: permission_uuid, name: billing.invoice.view}]}}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    PermissionList: {description: Permission list, content: {application/json: {example: {success: true, message: OK, data: [{uuid: permission_uuid, module: billing, name: billing.invoice.view, display_name: Billing Invoice View, status: active}], meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    PermissionSingle: {description: Single permission, content: {application/json: {example: {success: true, message: OK, data: {permission: {uuid: permission_uuid, module: billing, name: billing.invoice.view, display_name: Billing Invoice View, status: active}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    GroupedPermissions: {description: Permissions grouped by module, content: {application/json: {example: {success: true, message: OK, data: {permissions: {billing: [{uuid: permission_uuid, module: billing, name: billing.invoice.view, display_name: Billing Invoice View}]}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    UserList: {description: Assigned users, content: {application/json: {example: {success: true, message: OK, data: {users: [{uuid: user_uuid, display_name: Sahil Admin, email: admin@example.com, status: active}]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    AssignedCount: {description: Assignment count, content: {application/json: {example: {success: true, message: Users assigned., data: {users: 2}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    SuccessNull: {description: Success with null data, content: {application/json: {example: {success: true, message: OK, data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    Unauthenticated: {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}, example: {success: false, message: Unauthenticated., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: {code: AUTHENTICATION_REQUIRED, details: []}}}}}
    Forbidden: {description: Missing permission, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}, example: {success: false, message: Missing permission., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: {code: PERMISSION_DENIED, details: {}}}}}}
    ValidationError: {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}, example: {success: false, message: Validation failed., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: {code: VALIDATION_ERROR, details: {name: [The name field is required.]}}}}}}
    InvalidCredentials: {description: Invalid credentials, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}, example: {success: false, message: Invalid credentials., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: {code: INVALID_CREDENTIALS, details: []}}}}}
