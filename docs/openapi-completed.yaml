openapi: 3.1.0
info:
  title: SaaS MyCRM Completed APIs
  version: 1.0.0
  description: Completed API surface in the same sequence as docs/completed-api-curls.md.
servers:
  - url: https://darkgreen-goat-738912.hostingersite.com
    description: Local API root
tags:
  - name: 0. Common Master Data
  - name: 1. Unified Auth
  - name: 2. Platform Auth/Profile/Security
  - name: 2. Platform API Tokens
  - name: 3. Tenant Auth/Profile/Security
  - name: 3. Tenant API Tokens
  - name: 4. Platform Admin
  - name: 5. Platform Roles
  - name: 5. Platform Permissions
  - name: 6. Tenant Roles
  - name: 6. Tenant Permissions
  - name: 7. Platform Billing and Catalog
paths:
  /api/common/v1/locations/countries:
    get:
      tags: [0. Common Master Data]
      summary: List active countries
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/LocationSearch'}]
      responses:
        '200': {$ref: '#/components/responses/CountryListResponse'}
  /api/common/v1/locations/states:
    get:
      tags: [0. Common Master Data]
      summary: List active states
      description: Common state dropdown API. Pass either country_id or country_iso2; optional search filters by state name or code.
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/CountryIdQuery'}, {$ref: '#/components/parameters/CountryIso2Query'}, {$ref: '#/components/parameters/LocationSearch'}]
      responses:
        '200': {$ref: '#/components/responses/StateListResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/common/v1/locations/cities:
    get:
      tags: [0. Common Master Data]
      summary: List active cities
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/StateIdQuery'}, {$ref: '#/components/parameters/CountryIdOptionalQuery'}, {$ref: '#/components/parameters/LocationSearch'}]
      responses:
        '200': {$ref: '#/components/responses/CityListResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/tenants/register:
    post:
      tags: [1. Unified Auth]
      summary: Register a new SaaS tenant and owner account
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantRegistrationRequest'}
            example:
              organization_name: Acme Pvt Ltd
              legal_name: Acme Private Limited
              display_name: Acme
              organization_code: ACME
              slug: acme
              company_size: small
              default_currency: INR
              default_timezone: Asia/Kolkata
              owner:
                first_name: Sahil
                last_name: Owner
                display_name: Sahil Owner
                email: owner@example.com
                mobile: '+919999999999'
                password: Password@123
                password_confirmation: Password@123
              office:
                office_name: Head Office
                address_line_1: Main Street
                postal_code: '400001'
      responses:
        '201': {$ref: '#/components/responses/TenantRegistrationResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/accounts/discover:
    post:
      tags: [1. Unified Auth]
      summary: Discover accounts by email
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiscoverRequest'}
            example: {email: user@example.com, device_name: Chrome on Windows}
      responses:
        '200': {$ref: '#/components/responses/DiscoverResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/accounts/login:
    post:
      tags: [1. Unified Auth]
      summary: Login selected account
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UnifiedLoginRequest'}
            example: {email: user@example.com, discovery_token: disc_short_lived_token, account_ref: acct_opaque_ref, password: StrongPassword#123, remember: true, device_name: Chrome on Windows}
      responses:
        '200': {$ref: '#/components/responses/LoginResponse'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/accounts/login/2fa:
    post:
      tags: [1. Unified Auth]
      summary: Verify login 2FA challenge
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginTwoFactorRequest'}
      responses:
        '200': {$ref: '#/components/responses/LoginResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/me:
    get:
      tags: [1. Unified Auth]
      summary: Current unified session
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/CurrentSessionResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/auth/v1/logout:
    post:
      tags: [1. Unified Auth]
      summary: Logout current unified session
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {all_devices: {type: boolean, example: false}}}
      responses:
        '200': {$ref: '#/components/responses/LogoutResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/auth/v1/password/forgot:
    post:
      tags: [1. Unified Auth]
      summary: Request password reset
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ForgotPasswordResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/password/reset:
    post:
      tags: [1. Unified Auth]
      summary: Reset password
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ResetPasswordResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/platform/v1/auth/forgot-password:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Request platform password reset
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformForgotPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ForgotPasswordResponse'}
  /api/platform/v1/auth/reset-password:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Reset platform password
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ResetPasswordResponse'}
  /api/platform/v1/auth/logout:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Revoke current platform token
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '401': {$ref: '#/components/responses/Unauthenticated'}}
  /api/platform/v1/auth/refresh:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Rotate current platform token
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {device_name: {type: string, example: platform-api}}}
      responses: {'200': {$ref: '#/components/responses/TokenRefreshResponse'}}
  /api/platform/v1/auth/me:
    get:
      tags: [2. Platform Auth/Profile/Security]
      summary: Platform current user
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PlatformMeResponse'}}
  /api/platform/v1/auth/verify-email/resend:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Queue platform verification email placeholder
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/platform/v1/auth/2fa/enable:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Start platform TOTP 2FA setup
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/TwoFactorEnableResponse'}}
  /api/platform/v1/auth/2fa/confirm:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Confirm platform TOTP 2FA setup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TwoFactorCodeRequest'}
      responses: {'200': {$ref: '#/components/responses/TwoFactorConfirmResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/platform/v1/auth/2fa/disable:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Disable platform 2FA
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [password], properties: {password: {type: string, format: password}}}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/platform/v1/profile:
    get:
      tags: [2. Platform Auth/Profile/Security]
      summary: Get platform profile
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}}
    patch:
      tags: [2. Platform Auth/Profile/Security]
      summary: Update platform profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
    put:
      tags: [2. Platform Auth/Profile/Security]
      summary: Update platform profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}}
  /api/platform/v1/profile/password:
    put:
      tags: [2. Platform Auth/Profile/Security]
      summary: Change platform password
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/platform/v1/settings/preferences:
    get:
      tags: [2. Platform Auth/Profile/Security]
      summary: List platform preferences
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
    put:
      tags: [2. Platform Auth/Profile/Security]
      summary: Update platform preferences
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferencesUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
  /api/platform/v1/profile/sessions:
    get:
      tags: [2. Platform Auth/Profile/Security]
      summary: List platform Sanctum sessions/tokens
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SessionsResponse'}}
  /api/platform/v1/profile/sessions/{session_id}:
    delete:
      tags: [2. Platform Auth/Profile/Security]
      summary: Revoke platform session/token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/platform/v1/api-tokens:
    get:
      tags: [2. Platform API Tokens]
      summary: List platform API tokens
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenListResponse'}}
    post:
      tags: [2. Platform API Tokens]
      summary: Create platform API token
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenCreateRequest'}
      responses: {'201': {$ref: '#/components/responses/ApiTokenCreatedResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/platform/v1/api-tokens/{token_uuid}:
    get:
      tags: [2. Platform API Tokens]
      summary: Show platform API token metadata
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenShowResponse'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/platform/v1/api-tokens/{token_uuid}/rotate:
    post:
      tags: [2. Platform API Tokens]
      summary: Rotate platform API token and return raw token once
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenCreatedResponse'}}
  /api/platform/v1/api-tokens/{token_uuid}/revoke:
    post:
      tags: [2. Platform API Tokens]
      summary: Revoke platform API token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/tenant/v1/auth/forgot-password:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Request tenant password reset
      security: []
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantForgotPasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/ForgotPasswordResponse'}}
  /api/tenant/v1/auth/reset-password:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Reset tenant password
      security: []
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantResetPasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/ResetPasswordResponse'}}
  /api/tenant/v1/auth/logout:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Revoke current tenant token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '401': {$ref: '#/components/responses/Unauthenticated'}}
  /api/tenant/v1/auth/refresh:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Rotate current tenant token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {device_name: {type: string, example: tenant-api}}}
      responses: {'200': {$ref: '#/components/responses/TokenRefreshResponse'}}
  /api/tenant/v1/auth/me:
    get:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Tenant current user
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/TenantMeResponse'}}
  /api/tenant/v1/auth/verify-email/resend:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Queue tenant verification email placeholder
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/tenant/v1/auth/2fa/enable:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Start tenant TOTP 2FA setup
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/TwoFactorEnableResponse'}}
  /api/tenant/v1/auth/2fa/confirm:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Confirm tenant TOTP 2FA setup
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TwoFactorCodeRequest'}
      responses: {'200': {$ref: '#/components/responses/TwoFactorConfirmResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/tenant/v1/auth/2fa/disable:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Disable tenant 2FA
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [password], properties: {password: {type: string, format: password}}}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/tenant/v1/profile:
    get:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Get tenant profile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/TenantProfileResponse'}}
    patch:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Update tenant profile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/TenantProfileResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
    put:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Update tenant profile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/TenantProfileResponse'}}
  /api/tenant/v1/profile/password:
    put:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Change tenant password
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/tenant/v1/profile/preferences:
    get:
      tags: [3. Tenant Auth/Profile/Security]
      summary: List tenant preferences
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
    put:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Update tenant preferences
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferencesUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
  /api/tenant/v1/profile/sessions:
    get:
      tags: [3. Tenant Auth/Profile/Security]
      summary: List tenant Sanctum sessions/tokens
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/SessionsResponse'}}
  /api/tenant/v1/profile/sessions/{session_id}:
    delete:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Revoke tenant session/token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/SessionId'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/tenant/v1/profile/api-tokens:
    get:
      tags: [3. Tenant API Tokens]
      summary: List tenant API tokens
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenListResponse'}}
    post:
      tags: [3. Tenant API Tokens]
      summary: Create tenant API token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenCreateRequest'}
      responses: {'201': {$ref: '#/components/responses/ApiTokenCreatedResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/tenant/v1/profile/api-tokens/{token_uuid}/rotate:
    post:
      tags: [3. Tenant API Tokens]
      summary: Rotate tenant API token and return raw token once
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenCreatedResponse'}}
  /api/tenant/v1/profile/api-tokens/{token_uuid}/revoke:
    post:
      tags: [3. Tenant API Tokens]
      summary: Revoke tenant API token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/platform/v1/dashboard/summary:
    get: {tags: [4. Platform Admin], summary: Platform dashboard summary, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/platform/v1/dashboard/charts:
    get: {tags: [4. Platform Admin], summary: Platform dashboard charts, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/dashboard/recent:
    get: {tags: [4. Platform Admin], summary: Platform dashboard recent records, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/dashboard/alerts:
    get: {tags: [4. Platform Admin], summary: Platform dashboard alerts and security events, security: [{bearerAuth: []}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/dashboard/export:
    post: {tags: [4. Platform Admin], summary: Export platform dashboard, security: [{bearerAuth: []}], responses: {'201': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/platform-users:
    get: {tags: [4. Platform Admin], summary: List platform staff, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}, {$ref: '#/components/parameters/Search'}], responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
    post: {tags: [4. Platform Admin], summary: Create platform staff, security: [{bearerAuth: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformStaffWrite'}}}}, responses: {'201': {$ref: '#/components/responses/GenericSuccess'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /api/platform/v1/platform-users/invite:
    post: {tags: [4. Platform Admin], summary: Invite platform staff, security: [{bearerAuth: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformStaffWrite'}}}}, responses: {'201': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/platform-users/export:
    post: {tags: [4. Platform Admin], summary: Export platform staff, security: [{bearerAuth: []}], responses: {'201': {$ref: '#/components/responses/GenericSuccess'}}}
  /api/platform/v1/platform-users/{platform_user_uuid}:
