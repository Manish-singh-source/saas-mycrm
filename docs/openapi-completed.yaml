openapi: 3.1.0
info:
  title: SaaS MyCRM Completed APIs
  version: 1.0.0
  description: Completed API surface in the same sequence as docs/completed-api-curls.md.
servers:
  - url: http://localhost:8000
    description: Local API root
tags:
  - name: 1. Unified Auth
  - name: 2. Platform Auth/Profile/Security
  - name: 2. Platform API Tokens
  - name: 3. Tenant Auth/Profile/Security
  - name: 3. Tenant API Tokens
  - name: 5. Platform Roles
  - name: 5. Platform Permissions
  - name: 6. Tenant Roles
  - name: 6. Tenant Permissions
paths:
  /api/auth/v1/accounts/discover:
    post:
      tags: [1. Unified Auth]
      summary: Discover accounts by email
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiscoverRequest'}
            example: {email: user@example.com, device_name: Chrome on Windows}
      responses:
        '200': {$ref: '#/components/responses/DiscoverResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/accounts/login:
    post:
      tags: [1. Unified Auth]
      summary: Login selected account
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UnifiedLoginRequest'}
            example: {email: user@example.com, discovery_token: disc_short_lived_token, account_ref: acct_opaque_ref, password: StrongPassword#123, remember: true, device_name: Chrome on Windows}
      responses:
        '200': {$ref: '#/components/responses/LoginResponse'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/accounts/login/2fa:
    post:
      tags: [1. Unified Auth]
      summary: Verify login 2FA challenge
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginTwoFactorRequest'}
      responses:
        '200': {$ref: '#/components/responses/LoginResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/me:
    get:
      tags: [1. Unified Auth]
      summary: Current unified session
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200': {$ref: '#/components/responses/CurrentSessionResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/auth/v1/logout:
    post:
      tags: [1. Unified Auth]
      summary: Logout current unified session
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {all_devices: {type: boolean, example: false}}}
      responses:
        '200': {$ref: '#/components/responses/LogoutResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/auth/v1/password/forgot:
    post:
      tags: [1. Unified Auth]
      summary: Request password reset
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ForgotPasswordResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/auth/v1/password/reset:
    post:
      tags: [1. Unified Auth]
      summary: Reset password
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ResetPasswordResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/platform/v1/auth/forgot-password:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Request platform password reset
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformForgotPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ForgotPasswordResponse'}
  /api/platform/v1/auth/reset-password:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Reset platform password
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/ResetPasswordResponse'}
  /api/platform/v1/auth/logout:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Revoke current platform token
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '401': {$ref: '#/components/responses/Unauthenticated'}}
  /api/platform/v1/auth/refresh:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Rotate current platform token
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {device_name: {type: string, example: platform-api}}}
      responses: {'200': {$ref: '#/components/responses/TokenRefreshResponse'}}
  /api/platform/v1/auth/me:
    get:
      tags: [2. Platform Auth/Profile/Security]
      summary: Platform current user
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PlatformMeResponse'}}
  /api/platform/v1/auth/verify-email/resend:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Queue platform verification email placeholder
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/platform/v1/auth/2fa/enable:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Start platform TOTP 2FA setup
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/TwoFactorEnableResponse'}}
  /api/platform/v1/auth/2fa/confirm:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Confirm platform TOTP 2FA setup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TwoFactorCodeRequest'}
      responses: {'200': {$ref: '#/components/responses/TwoFactorConfirmResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/platform/v1/auth/2fa/disable:
    post:
      tags: [2. Platform Auth/Profile/Security]
      summary: Disable platform 2FA
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [password], properties: {password: {type: string, format: password}}}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/platform/v1/profile:
    get:
      tags: [2. Platform Auth/Profile/Security]
      summary: Get platform profile
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}}
    patch:
      tags: [2. Platform Auth/Profile/Security]
      summary: Update platform profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
    put:
      tags: [2. Platform Auth/Profile/Security]
      summary: Update platform profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PlatformProfileResponse'}}
  /api/platform/v1/profile/password:
    put:
      tags: [2. Platform Auth/Profile/Security]
      summary: Change platform password
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/platform/v1/settings/preferences:
    get:
      tags: [2. Platform Auth/Profile/Security]
      summary: List platform preferences
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
    put:
      tags: [2. Platform Auth/Profile/Security]
      summary: Update platform preferences
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferencesUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
  /api/platform/v1/profile/sessions:
    get:
      tags: [2. Platform Auth/Profile/Security]
      summary: List platform Sanctum sessions/tokens
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/SessionsResponse'}}
  /api/platform/v1/profile/sessions/{session_id}:
    delete:
      tags: [2. Platform Auth/Profile/Security]
      summary: Revoke platform session/token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/platform/v1/api-tokens:
    get:
      tags: [2. Platform API Tokens]
      summary: List platform API tokens
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenListResponse'}}
    post:
      tags: [2. Platform API Tokens]
      summary: Create platform API token
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenCreateRequest'}
      responses: {'201': {$ref: '#/components/responses/ApiTokenCreatedResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/platform/v1/api-tokens/{token_uuid}:
    get:
      tags: [2. Platform API Tokens]
      summary: Show platform API token metadata
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenShowResponse'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/platform/v1/api-tokens/{token_uuid}/rotate:
    post:
      tags: [2. Platform API Tokens]
      summary: Rotate platform API token and return raw token once
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenCreatedResponse'}}
  /api/platform/v1/api-tokens/{token_uuid}/revoke:
    post:
      tags: [2. Platform API Tokens]
      summary: Revoke platform API token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/tenant/v1/auth/forgot-password:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Request tenant password reset
      security: []
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantForgotPasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/ForgotPasswordResponse'}}
  /api/tenant/v1/auth/reset-password:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Reset tenant password
      security: []
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantResetPasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/ResetPasswordResponse'}}
  /api/tenant/v1/auth/logout:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Revoke current tenant token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '401': {$ref: '#/components/responses/Unauthenticated'}}
  /api/tenant/v1/auth/refresh:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Rotate current tenant token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {device_name: {type: string, example: tenant-api}}}
      responses: {'200': {$ref: '#/components/responses/TokenRefreshResponse'}}
  /api/tenant/v1/auth/me:
    get:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Tenant current user
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/TenantMeResponse'}}
  /api/tenant/v1/auth/verify-email/resend:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Queue tenant verification email placeholder
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/tenant/v1/auth/2fa/enable:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Start tenant TOTP 2FA setup
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/TwoFactorEnableResponse'}}
  /api/tenant/v1/auth/2fa/confirm:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Confirm tenant TOTP 2FA setup
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TwoFactorCodeRequest'}
      responses: {'200': {$ref: '#/components/responses/TwoFactorConfirmResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/tenant/v1/auth/2fa/disable:
    post:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Disable tenant 2FA
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [password], properties: {password: {type: string, format: password}}}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/tenant/v1/profile:
    get:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Get tenant profile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/TenantProfileResponse'}}
    patch:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Update tenant profile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/TenantProfileResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
    put:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Update tenant profile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/TenantProfileResponse'}}
  /api/tenant/v1/profile/password:
    put:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Change tenant password
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '422': {$ref: '#/components/responses/InvalidPassword'}}
  /api/tenant/v1/profile/preferences:
    get:
      tags: [3. Tenant Auth/Profile/Security]
      summary: List tenant preferences
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
    put:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Update tenant preferences
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferencesUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/PreferencesResponse'}}
  /api/tenant/v1/profile/sessions:
    get:
      tags: [3. Tenant Auth/Profile/Security]
      summary: List tenant Sanctum sessions/tokens
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/SessionsResponse'}}
  /api/tenant/v1/profile/sessions/{session_id}:
    delete:
      tags: [3. Tenant Auth/Profile/Security]
      summary: Revoke tenant session/token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/SessionId'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/tenant/v1/profile/api-tokens:
    get:
      tags: [3. Tenant API Tokens]
      summary: List tenant API tokens
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenListResponse'}}
    post:
      tags: [3. Tenant API Tokens]
      summary: Create tenant API token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenCreateRequest'}
      responses: {'201': {$ref: '#/components/responses/ApiTokenCreatedResponse'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/tenant/v1/profile/api-tokens/{token_uuid}/rotate:
    post:
      tags: [3. Tenant API Tokens]
      summary: Rotate tenant API token and return raw token once
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/ApiTokenCreatedResponse'}}
  /api/tenant/v1/profile/api-tokens/{token_uuid}/revoke:
    post:
      tags: [3. Tenant API Tokens]
      summary: Revoke tenant API token
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/TokenUuid'}]
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}}
  /api/platform/v1/access-control/roles:
    get:
      tags: [5. Platform Roles]
      summary: List platform roles
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}, {$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/StatusFilter'}, {$ref: '#/components/parameters/RoleTypeFilter'}, {$ref: '#/components/parameters/GuardFilter'}]
      responses: {'200': {$ref: '#/components/responses/RoleList'}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      tags: [5. Platform Roles]
      summary: Create platform role
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleWrite'}}}}
      responses: {'201': {$ref: '#/components/responses/RoleSingle'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/platform/v1/access-control/roles/{role_uuid}:
    parameters: [{$ref: '#/components/parameters/RoleUuid'}]
    get:
      tags: [5. Platform Roles]
      summary: View platform role
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/RoleSingle'}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [5. Platform Roles]
      summary: Update platform role
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/RoleSingle'}, '403': {$ref: '#/components/responses/SystemRoleRenameForbidden'}}
    put:
      tags: [5. Platform Roles]
      summary: Update platform role
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/RoleSingle'}}
    delete:
      tags: [5. Platform Roles]
      summary: Delete custom unused platform role
      security: [{bearerAuth: []}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuditReason'}}}}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '403': {$ref: '#/components/responses/SystemRoleDeleteForbidden'}, '409': {$ref: '#/components/responses/RoleInUse'}}
  /api/platform/v1/access-control/roles/{role_uuid}/clone:
    post:
      tags: [5. Platform Roles]
      summary: Clone platform role
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RoleUuid'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleClone'}}}}
      responses: {'201': {$ref: '#/components/responses/RoleSingle'}}
  /api/platform/v1/access-control/roles/{role_uuid}/activate:
    post:
      tags: [5. Platform Roles]
      summary: Activate platform role
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RoleUuid'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuditReason'}}}}
      responses: {'200': {$ref: '#/components/responses/RoleSingle'}}
  /api/platform/v1/access-control/roles/{role_uuid}/deactivate:
    post:
      tags: [5. Platform Roles]
      summary: Deactivate platform role
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RoleUuid'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuditReason'}}}}
      responses: {'200': {$ref: '#/components/responses/RoleSingle'}}
  /api/platform/v1/access-control/roles/{role_uuid}/permissions:
    get:
      tags: [5. Platform Roles]
      summary: List platform role permissions grouped by module
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RoleUuid'}]
      responses: {'200': {$ref: '#/components/responses/GroupedPermissions'}}
    put:
      tags: [5. Platform Roles]
      summary: Replace platform role permissions
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RoleUuid'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PermissionAssignment'}}}}
      responses: {'200': {$ref: '#/components/responses/RoleSingle'}}
  /api/platform/v1/access-control/roles/{role_uuid}/users:
    get:
      tags: [5. Platform Roles]
      summary: List platform users assigned to role
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RoleUuid'}]
      responses: {'200': {$ref: '#/components/responses/UserList'}}
    post:
      tags: [5. Platform Roles]
      summary: Assign platform users to role
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RoleUuid'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformUserAssignment'}}}}
      responses: {'200': {$ref: '#/components/responses/AssignedCount'}}
  /api/platform/v1/access-control/roles/{role_uuid}/users/{platform_user_uuid}:
    delete:
      tags: [5. Platform Roles]
      summary: Remove platform user from role
