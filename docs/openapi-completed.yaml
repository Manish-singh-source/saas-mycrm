      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AuditReason'}}}}
      responses: {'200': {$ref: '#/components/responses/SuccessNull'}, '409': {$ref: '#/components/responses/FinalOwnerAdminRequired'}}
  /api/tenant/v1/access-control/permissions:
    get:
      tags: [6. Tenant Permissions]
      summary: List tenant permissions
