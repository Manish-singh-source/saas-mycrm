    put: {tags: [7. Platform Billing and Catalog], summary: Override tenant module access, parameters: [{$ref: '#/components/parameters/TenantUuid'}, {$ref: '#/components/parameters/ModuleCode'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/TenantModuleOverride'}}}}, responses: {'200': {$ref: '#/components/responses/GenericSuccess'}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    RequestId: {name: X-Request-Id, in: header, required: false, schema: {type: string, example: '{{REQUEST_ID}}'}}
    TenantHeader: {name: X-Tenant, in: header, required: true, schema: {type: string, example: '{{TENANT}}'}}
    LocationSearch: {name: search, in: query, required: false, schema: {type: string, example: ind}}
    CountryIdQuery: {name: country_id, in: query, required: false, schema: {type: integer, example: 1}}
    CountryIso2Query: {name: country_iso2, in: query, required: false, schema: {type: string, example: IN}}
    CountryIdOptionalQuery: {name: country_id, in: query, required: false, schema: {type: integer, example: 1}}
    StateIdQuery: {name: state_id, in: query, required: true, schema: {type: integer, example: 1}}
    Page: {name: page, in: query, schema: {type: integer, example: 1}}
    PerPage: {name: per_page, in: query, schema: {type: integer, example: 25}}
    Search: {name: search, in: query, schema: {type: string, example: billing}}
    StatusFilter: {name: 'filter[status]', in: query, schema: {type: string, enum: [active, inactive]}}
    RoleTypeFilter: {name: 'filter[type]', in: query, schema: {type: string, enum: [system, custom]}}
    GuardFilter: {name: 'filter[guard_name]', in: query, schema: {type: string, example: platform}}
    ModuleFilter: {name: 'filter[module]', in: query, schema: {type: string, example: billing}}
    SessionId: {name: session_id, in: path, required: true, schema: {type: integer, example: 1}}
    TokenUuid: {name: token_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    RoleUuid: {name: role_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    PermissionUuid: {name: permission_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    PlatformUserUuid: {name: platform_user_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    UserUuid: {name: user_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    TenantUuid: {name: tenant_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    TeamUuid: {name: team_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string}, example: '{{REQUEST_ID}}-billing-action'}
    SubscriptionUuid: {name: subscription_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    PlanUuid: {name: plan_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    FeatureUuid: {name: feature_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    AddonUuid: {name: addon_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    AddonId: {name: addon_id, in: path, required: true, schema: {type: integer}}
    InvoiceUuid: {name: invoice_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    PaymentUuid: {name: payment_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    RefundUuid: {name: refund_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    CouponUuid: {name: coupon_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    ModuleUuid: {name: module_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    ModuleCode: {name: module_code, in: path, required: true, schema: {type: string}}
  schemas:
    Country:
      type: object
      properties:
        id: {type: integer, example: 1}
        name: {type: string, example: India}
        iso2: {type: string, example: IN}
        iso3: {type: string, example: IND}
        phone_code: {type: string, example: '+91'}
        currency_code: {type: string, example: INR}
    State:
      type: object
      properties:
        id: {type: integer, example: 1}
        country_id: {type: integer, example: 1}
        name: {type: string, example: Gujarat}
        code: {type: string, example: GJ}
    City:
      type: object
      properties:
        id: {type: integer, example: 1}
        country_id: {type: integer, example: 1}
        state_id: {type: integer, example: 1}
        name: {type: string, example: Ahmedabad}
    PlatformStaffWrite:
      type: object
      properties:
        first_name: {type: string, example: Priya}
        last_name: {type: string, example: Admin}
        display_name: {type: string, example: Priya Admin}
        email: {type: string, format: email, example: priya.admin@example.com}
        password: {type: string, format: password, example: Password@123}
        department: {type: string, example: Support}
        designation: {type: string, example: Manager}
        status: {type: string, enum: [active, inactive, suspended]}
    PlatformTeamWrite:
      type: object
      properties:
        name: {type: string, example: Customer Success}
        code: {type: string, example: customer-success}
        description: {type: string, nullable: true}
        status: {type: string, enum: [active, inactive]}
    PlatformTenantCreate:
      type: object
      required: [organization_name, organization_code, slug, owner, office]
      properties:
        organization_name: {type: string, example: Acme Pvt Ltd}
        organization_code: {type: string, example: ACME}
        slug: {type: string, example: acme}
        plan_uuid: {type: string, format: uuid}
        trial_days: {type: integer, example: 14}
        owner: {type: object, properties: {first_name: {type: string, example: Sahil}, email: {type: string, format: email}, password: {type: string, format: password}}}
        office: {type: object, properties: {office_name: {type: string, example: Head Office}, address_line_1: {type: string}}}
    TenantRegistrationRequest:
      type: object
      required: [organization_name, owner]
      properties:
        organization_name: {type: string, example: Acme Pvt Ltd}
        legal_name: {type: string, nullable: true, example: Acme Private Limited}
        display_name: {type: string, nullable: true, example: Acme}
        organization_code: {type: string, nullable: true, example: ACME}
        slug: {type: string, nullable: true, example: acme}
        business_type_id: {type: integer, nullable: true}
        industry_id: {type: integer, nullable: true}
        company_size: {type: string, enum: [self, small, medium, large, enterprise], nullable: true}
        gst_number: {type: string, nullable: true}
        pan_number: {type: string, nullable: true}
        registration_number: {type: string, nullable: true}
        website: {type: string, nullable: true, example: 'https://acme.example.com'}
        default_currency: {type: string, example: INR}
        default_timezone: {type: string, example: Asia/Kolkata}
        owner:
          type: object
          required: [first_name, email, password, password_confirmation]
          properties:
            first_name: {type: string, example: Sahil}
            last_name: {type: string, nullable: true, example: Owner}
            display_name: {type: string, nullable: true, example: Sahil Owner}
            email: {type: string, format: email, example: owner@example.com}
            mobile: {type: string, nullable: true, example: '+919999999999'}
            password: {type: string, format: password, example: Password@123}
            password_confirmation: {type: string, format: password, example: Password@123}
        office:
          type: object
          properties:
            office_name: {type: string, nullable: true, example: Head Office}
            address_line_1: {type: string, nullable: true}
            address_line_2: {type: string, nullable: true}
            landmark: {type: string, nullable: true}
            country_id: {type: integer, nullable: true}
            state_id: {type: integer, nullable: true}
            city_id: {type: integer, nullable: true}
            postal_code: {type: string, nullable: true}
            contact_phone: {type: string, nullable: true}
    DiscoverRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}, device_name: {type: string}}
    UnifiedLoginRequest:
      type: object
      required: [email, discovery_token, account_ref, password]
      properties: {email: {type: string, format: email}, discovery_token: {type: string}, account_ref: {type: string}, password: {type: string, format: password}, remember: {type: boolean}, device_name: {type: string}}
    LoginTwoFactorRequest:
      type: object
      required: [challenge_token, code]
      properties: {challenge_token: {type: string}, code: {type: string, example: '123456'}, remember_device: {type: boolean}, device_name: {type: string}}
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}, account_ref: {type: string}, discovery_token: {type: string}}
    PlatformForgotPasswordRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}}
    TenantForgotPasswordRequest:
      type: object
      required: [tenant, email]
      properties: {tenant: {type: string, example: '{{TENANT}}'}, email: {type: string, format: email}}
    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties: {email: {type: string, format: email}, token: {type: string}, password: {type: string, format: password}, password_confirmation: {type: string, format: password}}
    TenantResetPasswordRequest:
      allOf:
        - $ref: '#/components/schemas/ResetPasswordRequest'
        - type: object
          required: [tenant]
          properties: {tenant: {type: string, example: '{{TENANT}}'}}
    TwoFactorCodeRequest: {type: object, required: [code], properties: {code: {type: string, example: '123456'}}}
    ChangePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties: {current_password: {type: string, format: password}, password: {type: string, format: password}, password_confirmation: {type: string, format: password}}
    ProfileUpdateRequest:
      type: object
      properties: {first_name: {type: string}, last_name: {type: string, nullable: true}, display_name: {type: string}, mobile: {type: string, nullable: true}, profile_photo_file_id: {type: integer, nullable: true}, timezone: {type: string, example: Asia/Kolkata}, locale: {type: string, example: en}}
    PreferencesUpdateRequest:
      type: object
      required: [preferences]
      properties: {preferences: {type: object, additionalProperties: true}}
    ApiTokenCreateRequest:
      type: object
      required: [name, abilities]
      properties: {name: {type: string, example: BI Warehouse Export}, abilities: {type: array, items: {type: string}, example: [report.view, report.export]}, expires_at: {type: string, format: date-time, nullable: true}}
    AuditReason: {type: object, properties: {audit_reason: {type: string, example: Quarterly access review}}}
    RoleWrite:
      type: object
      required: [name, display_name]
      properties:
        name: {type: string, example: billing_manager_custom}
        display_name: {type: string, example: Billing Manager Custom}
        guard_name: {type: string, example: platform}
        description: {type: string, nullable: true}
        status: {type: string, enum: [active, inactive], example: active}
        is_system: {type: boolean, example: false}
        permission_ids: {type: array, items: {type: string, format: uuid}}
        audit_reason: {type: string, nullable: true}
    RoleUpdate:
      allOf: [{$ref: '#/components/schemas/RoleWrite'}]
    RoleClone:
      type: object
      required: [name, display_name]
      properties: {name: {type: string, example: billing_manager_copy}, display_name: {type: string, example: Billing Manager Copy}, copy_permissions: {type: boolean, example: true}, copy_description: {type: boolean, example: true}, status: {type: string, enum: [active, inactive], example: inactive}, audit_reason: {type: string, nullable: true}}
    PermissionAssignment:
      type: object
      required: [permission_ids]
      properties: {permission_ids: {type: array, items: {type: string, format: uuid}}, audit_reason: {type: string, nullable: true}}
    PlatformUserAssignment:
      type: object
      required: [platform_user_ids]
      properties: {platform_user_ids: {type: array, items: {type: string, format: uuid}}, audit_reason: {type: string, nullable: true}}
    TenantUserAssignment:
      type: object
      required: [user_ids]
      properties: {user_ids: {type: array, items: {type: string, format: uuid}}, audit_reason: {type: string, nullable: true}}
    PermissionWrite:
      type: object
      required: [module, name]
      properties: {module: {type: string, example: billing}, name: {type: string, example: billing.adjustment.create}, display_name: {type: string, example: Create Billing Adjustment}, guard_name: {type: string, example: platform}, description: {type: string, nullable: true}, is_system: {type: boolean, example: false}, status: {type: string, enum: [active, inactive], example: active}}
    PermissionUpdate:
      allOf: [{$ref: '#/components/schemas/PermissionWrite'}]
    PlanWrite: {type: object, required: [name, code, billing_cycle, base_price], properties: {name: {type: string}, code: {type: string}, description: {type: string}, billing_cycle: {type: string}, base_price: {type: number}, currency: {type: string, example: INR}, trial_days: {type: integer}, is_custom: {type: boolean}, is_public: {type: boolean}, status: {type: string}}}
    FeatureWrite: {type: object, required: [module, name, code, data_type], properties: {module: {type: string}, name: {type: string}, code: {type: string}, data_type: {type: string, enum: [boolean, integer, decimal, string, json]}, unit: {type: string}, description: {type: string}, status: {type: string}}}
    AddonWrite: {type: object, required: [name, code, pricing_type, price], properties: {name: {type: string}, code: {type: string}, pricing_type: {type: string}, price: {type: number}, currency: {type: string}, status: {type: string}}}
    PlanFeaturesWrite: {type: object, required: [features], properties: {features: {type: array, items: {type: object, properties: {feature_uuid: {type: string, format: uuid}, value: {}, metadata: {type: object}}}}}}
    CloneBody: {type: object, required: [name, code], properties: {name: {type: string}, code: {type: string}, status: {type: string}}}
    SubscriptionWrite: {type: object, required: [tenant_id, plan_id], properties: {tenant_id: {type: string, format: uuid}, plan_id: {type: string, format: uuid}, type: {type: string}, billing_cycle: {type: string}, status: {type: string}, renewal_type: {type: string}, starts_at: {type: string, format: date-time}, expires_at: {type: string, format: date-time}, currency: {type: string}, auto_renew: {type: boolean}, notes: {type: string}}}
    SubscriptionAddonWrite: {type: object, required: [addon_plan_id], properties: {addon_plan_id: {type: string, format: uuid}, quantity: {type: integer}, unit_price: {type: number}, starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}, status: {type: string}}}
    ApplyCoupon: {type: object, properties: {coupon_code: {type: string}, coupon_uuid: {type: string, format: uuid}}}
    InvoiceWrite: {type: object, required: [tenant_id, invoice_date, items], properties: {tenant_id: {type: string, format: uuid}, subscription_id: {type: string, format: uuid}, invoice_date: {type: string, format: date}, due_date: {type: string, format: date}, currency: {type: string}, status: {type: string}, discount_amount: {type: number}, tax_amount: {type: number}, items: {type: array, items: {type: object, properties: {item_type: {type: string}, description: {type: string}, quantity: {type: number}, unit_price: {type: number}, amount: {type: number}, metadata: {type: object}}}}}}
    PaymentWrite: {type: object, required: [amount, payment_status], properties: {tenant_id: {type: string, format: uuid}, platform_invoice_id: {type: string, format: uuid}, subscription_id: {type: string, format: uuid}, gateway: {type: string}, gateway_payment_id: {type: string}, payment_method: {type: string}, amount: {type: number}, currency: {type: string}, payment_status: {type: string}, paid_at: {type: string, format: date-time}, failure_reason: {type: string}, raw_response: {type: object}}}
    RefundWrite: {type: object, required: [amount], properties: {platform_payment_id: {type: string, format: uuid}, amount: {type: number}, currency: {type: string}, reason: {type: string}, gateway: {type: string}}}
    CouponWrite: {type: object, required: [code, name, discount_type, discount_value], properties: {code: {type: string}, name: {type: string}, discount_type: {type: string, enum: [fixed, percent]}, discount_value: {type: number}, starts_at: {type: string, format: date-time}, expires_at: {type: string, format: date-time}, max_redemptions: {type: integer}, status: {type: string}, plan_uuids: {type: array, items: {type: string, format: uuid}}, tenant_uuids: {type: array, items: {type: string, format: uuid}}}}
    ModuleWrite: {type: object, required: [name, code], properties: {name: {type: string}, code: {type: string}, description: {type: string}, icon: {type: string}, category: {type: string}, is_core: {type: boolean}, status: {type: string}, sort_order: {type: integer}}}
    TenantModuleOverride: {type: object, required: [enabled], properties: {enabled: {type: boolean}, limits: {type: object}, metadata: {type: object}, reason: {type: string}}}
    ReasonBody: {type: object, required: [reason], properties: {reason: {type: string}}}
    ApiError:
      type: object
      properties:
        success: {type: boolean, example: false}
        message: {type: string}
        data: {nullable: true}
        meta: {type: object, properties: {request_id: {type: string}}}
        errors: {type: object, properties: {code: {type: string}, details: {type: object}}}
  responses:
    IdempotencyRequired: {description: Idempotency key required, content: {application/json: {example: {success: false, message: Idempotency-Key header is required for this financial mutation., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: {code: IDEMPOTENCY_KEY_REQUIRED, details: []}}}}}
    IdempotencyConflict: {description: Idempotency key conflict, content: {application/json: {example: {success: false, message: Idempotency-Key was already used with different request data., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: {code: IDEMPOTENCY_KEY_CONFLICT, details: []}}}}}
    InvoiceNotDraft: {description: Invoice not draft, content: {application/json: {example: {success: false, message: Only draft invoices can be updated., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: {code: INVOICE_NOT_DRAFT, details: []}}}}}
    CountryListResponse:
      description: Active country list
      content:
        application/json:
          example:
            success: true
            message: OK
            data:
              countries:
                - {id: 1, name: India, iso2: IN, iso3: IND, phone_code: '+91', currency_code: INR}
            meta: {request_id: '{{REQUEST_ID}}'}
            errors: null
    StateListResponse:
      description: Active state list for a country
      content:
        application/json:
          example:
            success: true
            message: OK
            data:
              states:
                - {id: 1, country_id: 1, name: Gujarat, code: GJ}
            meta: {request_id: '{{REQUEST_ID}}'}
            errors: null
    CityListResponse:
      description: Active city list for a state
      content:
        application/json:
          example:
            success: true
            message: OK
            data:
              cities:
                - {id: 1, country_id: 1, state_id: 1, name: Ahmedabad}
            meta: {request_id: '{{REQUEST_ID}}'}
            errors: null
    GenericSuccess: {description: Successful response, content: {application/json: {example: {success: true, message: OK, data: {}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TenantRegistrationResponse:
      description: Tenant registered and owner token issued
      content:
        application/json:
          example:
            success: true
            message: Tenant registered.
            data:
              access_token: plain_text_token_returned_once
              token_type: Bearer
              expires_at: '2026-08-08T12:00:00.000000Z'
              tenant: {uuid: tenant_uuid, organization_name: Acme Pvt Ltd, display_name: Acme, organization_code: ACME, slug: acme, status: trial}
              owner: {uuid: user_uuid, display_name: Sahil Owner, email: owner@example.com, account_type: owner, status: active}
              roles: [owner]
              permissions: [dashboard.view, role.view]
            meta: {request_id: '{{REQUEST_ID}}'}
            errors: null
    DiscoverResponse: {description: Accounts discovered, content: {application/json: {example: {success: true, message: OK, data: {email: user@example.com, discovery_token: disc_short_lived_token, expires_in_seconds: 300, accounts: [{account_ref: acct_opaque_platform_ref, account_type: platform, auth_guard: platform, display_name: Super Admin, email: user@example.com, roles: [super_admin], status: active}]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    LoginResponse: {description: Login success or 2FA challenge, content: {application/json: {example: {success: true, message: Logged in., data: {access_token: plain_text_token_returned_once, token_type: Bearer, surface: platform, redirect_to: /platform/dashboard, account: {uuid: platform_user_uuid, display_name: Super Admin, roles: [super_admin], permissions: [dashboard.view]}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    CurrentSessionResponse: {description: Current session, content: {application/json: {example: {success: true, message: OK, data: {surface: tenant, account: {uuid: user_uuid, display_name: Staff User, roles: [sales_user], permissions: [lead.view]}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    LogoutResponse: {description: Logged out, content: {application/json: {example: {success: true, message: OK, data: {logged_out: true}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    ForgotPasswordResponse: {description: Password reset email sent, content: {application/json: {example: {success: true, message: Password reset instructions sent., data: {reset_token: local_only_reset_token}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    ResetPasswordResponse: {description: Password reset completed, content: {application/json: {example: {success: true, message: Password reset completed., data: null, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TokenRefreshResponse: {description: Token refreshed, content: {application/json: {example: {success: true, message: Token refreshed., data: {access_token: plain_text_token_returned_once, token_type: Bearer}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    PlatformMeResponse: {description: Platform current user, content: {application/json: {example: {success: true, message: OK, data: {user: {uuid: platform_user_uuid, display_name: Super Admin}, roles: [super_admin], permissions: [dashboard.view]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TenantMeResponse: {description: Tenant current user, content: {application/json: {example: {success: true, message: OK, data: {tenant: {uuid: tenant_uuid, slug: acme}, user: {uuid: user_uuid, display_name: Acme Owner}, roles: [owner], permissions: [dashboard.view]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    PlatformProfileResponse: {description: Platform profile, content: {application/json: {example: {success: true, message: OK, data: {user: {uuid: platform_user_uuid, display_name: Sahil Admin}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TenantProfileResponse: {description: Tenant profile, content: {application/json: {example: {success: true, message: OK, data: {user: {uuid: user_uuid, display_name: Sahil Owner}}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TwoFactorEnableResponse: {description: 2FA setup started, content: {application/json: {example: {success: true, message: Confirm 2FA setup., data: {secret: BASE32TOTPSECRET, provisioning_uri: otpauth://totp/SaaS%20CRM:user@example.com}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    TwoFactorConfirmResponse: {description: 2FA enabled, content: {application/json: {example: {success: true, message: 2FA enabled., data: {recovery_codes: [RECOVERYCODE1]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    PreferencesResponse: {description: Preferences, content: {application/json: {example: {success: true, message: OK, data: {preferences: []}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
    SessionsResponse: {description: Sessions, content: {application/json: {example: {success: true, message: OK, data: {sessions: [{id: 1, name: Chrome on Windows, abilities: [platform:*]}]}, meta: {request_id: '{{REQUEST_ID}}'}, errors: null}}}}
